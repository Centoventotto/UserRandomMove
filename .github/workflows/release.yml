name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p build/UserRandomMove
          cp index.tsx build/UserRandomMove/
          cd build && zip -r ../UserRandomMove.zip UserRandomMove

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" UserRandomMove.zip \
            --target "$GITHUB_SHA" \
            --title "UserRandomMove $TAG" \
            --notes "Extract \`UserRandomMove.zip\` into \`Equicord/src/userplugins\`, then run \`pnpm build\` and \`pnpm inject\`. See the README for details."
